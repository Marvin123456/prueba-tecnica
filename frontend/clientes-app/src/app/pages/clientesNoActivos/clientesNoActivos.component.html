<div class="container mt-4">
  <div class="card mb-4">
    <div class="card-header bg-success text-white">
      <h5>{{ modoEdicion ? 'Editar Cliente' : 'Nuevo Cliente' }}</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="guardarCliente()">
        <div class="row mb-3">
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Nombre" [(ngModel)]="clienteForm.nombre" name="nombre" required>
          </div>
          <div class="col-md-6">
            <input type="email" class="form-control" placeholder="Correo" [(ngModel)]="clienteForm.correo" name="correo">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Teléfono" [(ngModel)]="clienteForm.telefono" name="telefono">
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Dirección" [(ngModel)]="clienteForm.direccion" name="direccion">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">{{ modoEdicion ? 'Actualizar' : 'Guardar' }}</button>
        <button type="button" class="btn btn-secondary ms-2" (click)="resetFormulario()" *ngIf="modoEdicion">Cancelar</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header bg-dark text-white">
      <h5>Lista de Clientes</h5>
    </div>
    <div class="card-body table-responsive">
      <table class="table table-hover">
        <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cliente of clientes">
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.correo }}</td>
            <td>{{ cliente.telefono }}</td>
            <td>{{ cliente.direccion }}</td>
            <td>
              <button class="btn btn-sm btn-warning me-2" (click)="editarCliente(cliente)">Editar</button>
              <button class="btn btn-sm btn-danger" (click)="eliminarCliente(cliente.id)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
